<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="base" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#241a3d"/>
      <stop offset="55%" stop-color="#120c1f"/>
      <stop offset="100%" stop-color="#08050d"/>
    </radialGradient>

    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5a524" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5a524" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>

    <radialGradient id="star" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <g filter="url(#soft)">
    <circle cx="220" cy="120" r="420" fill="url(#teal)"/>
    <circle cx="1680" cy="260" r="480" fill="url(#purple)"/>
    <circle cx="420" cy="960" r="400" fill="url(#gold)"/>
    <circle cx="1580" cy="900" r="380" fill="url(#rose)"/>
    <circle cx="960" cy="540" r="520" fill="url(#blue)"/>
  </g>

  <!-- Faint scattered "stars" for texture, like a night sky over the board -->
  <g opacity="0.5">
    <circle cx="120" cy="80" r="1.6" fill="url(#star)"/>
    <circle cx="340" cy="220" r="1.2" fill="url(#star)"/>
    <circle cx="560" cy="60" r="1.4" fill="url(#star)"/>
    <circle cx="780" cy="180" r="1.1" fill="url(#star)"/>
    <circle cx="980" cy="90" r="1.5" fill="url(#star)"/>
    <circle cx="1180" cy="240" r="1.2" fill="url(#star)"/>
    <circle cx="1400" cy="70" r="1.3" fill="url(#star)"/>
    <circle cx="1620" cy="200" r="1.6" fill="url(#star)"/>
    <circle cx="1820" cy="120" r="1.2" fill="url(#star)"/>
    <circle cx="90" cy="480" r="1.3" fill="url(#star)"/>
    <circle cx="300" cy="620" r="1.1" fill="url(#star)"/>
    <circle cx="1700" cy="500" r="1.4" fill="url(#star)"/>
    <circle cx="1850" cy="680" r="1.2" fill="url(#star)"/>
    <circle cx="150" cy="820" r="1.5" fill="url(#star)"/>
    <circle cx="1750" cy="900" r="1.3" fill="url(#star)"/>
    <circle cx="1000" cy="1000" r="1.2" fill="url(#star)"/>
    <circle cx="620" cy="980" r="1.4" fill="url(#star)"/>
    <circle cx="1300" cy="1020" r="1.1" fill="url(#star)"/>
  </g>
</svg>
